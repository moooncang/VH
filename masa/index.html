}

  $('gradeEmblem').src=`assets/ui/D4-24_grade-${grade.toLowerCase()}_default.png`;$('grade').textContent=grade;$('score').textContent=score.toLocaleString();$('resultLine').textContent=pick(CONFIG.대사['결과_'+grade]||['…']);
  const average=Math.round(session.time>0?session.satSum/session.time:satisfy),rows=[['마사지 시간',`${Math.floor(session.time/60)}분 ${Math.floor(session.time%60)}초`],['평균 · 최고 만족도',`${average}% · ${Math.round(session.maxSat)}%`],['최고 흥분도',`${Math.round(session.maxArousal)}%`],
    ['풀어준 뭉침',`${session.knots} / ${knots.length}`],['약점',(()=>{const f=weaks.filter(w=>w.found);return `${f.length} / ${weaks.length}${f.length?' · '+f.map(w=>w.part+' '+'♥'.repeat(w.level)).join(' '):''}`;})()],['요청',`${session.requests}개 완료${session.failed?` · ${session.failed}개 놓침`:''}`],['절정 · 극락',`${session.climax}회 · ${session.bliss}회`]];
  $('resultStats').replaceChildren(...rows.map(([k,v])=>{const row=document.createElement('div'),term=document.createElement('dt'),value=document.createElement('dd');term.textContent=k;value.textContent=v;row.append(term,value);return row;}));
  const after=affectionLevel();$('resultAffection').textContent=`호감도 +${gain} · Lv.${after}${after>before?' 레벨 업!':''}`;
  $('result').hidden=false;$('resultContinue').focus();updateTimer();updateProfileLine();
}
function continueSession(){$('result').hidden=true;finished=false;mode='free';updateTimer();}
function updateProfileLine(){const el=$('profileLine'),level=document.createElement('b');level.textContent=`Lv.${affectionLevel()}`;el.replaceChildren('호감도',level);if(profile.visits){const extra=document.createElement('span');extra.textContent=` · 방문 ${profile.visits}회${profile.best?` · 최고 ${profile.best}`:''}`;el.append(extra);}}

async function loadLayerImages(){
  const folder=CONFIG.파일.레이어,response=await fetch(folder+'manifest.json',{cache:'no-cache'});if(!response.ok)return null;
  const manifest=await response.json();let done=0;$('progress').max=manifest.layers.length;$('progress').value=0;
  const children=await Promise.all(manifest.layers.map(async item=>{const image=new Image();image.src=folder+item.file;await image.decode();const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;canvas.getContext('2d',{willReadFrequently:true}).drawImage(image,0,0);$('progress').value=++done;
    return {name:item.name,left:item.left,top:item.top,right:item.left+canvas.width,bottom:item.top+canvas.height,opacity:item.opacity,hidden:item.hidden,canvas};}));
  return {width:manifest.width,height:manifest.height,children,fromImages:true};
}
async function readPsdBuffer(){const response=await fetch(CONFIG.파일.PSD);if(!response.ok)throw new Error(`PSD 경로를 확인해주세요 (${response.status}).`);const limit=CONFIG.파일.최대용량MB*1024*1024;const size=Number(response.headers.get('content-length'));if(size>limit)throw new Error('PSD 파일이 용량 제한을 초과했습니다.');
  if(!response.body)return response.arrayBuffer();const reader=response.body.getReader(),chunks=[];let loaded=0;while(true){const {done,value}=await reader.read();if(done)break;loaded+=value.length;if(loaded>limit){await reader.cancel();throw new Error('PSD 파일이 용량 제한을 초과했습니다.');}chunks.push(value);if(size){$('progress').max=size;$('progress').value=loaded;}}
  const data=new Uint8Array(loaded);let offset=0;for(const chunk of chunks){data.set(chunk,offset);offset+=chunk.length;}return data.buffer;}
async function init(buffer){const sequence=++loadSequence;loading=true;$('message').hidden=true;$('loading').hidden=false;$('start').disabled=$('startCourse').disabled=true;
  try{await ensurePixi();if(sequence!==loadSequence)return;
    if(!app){if(!PIXI.utils.isWebGLSupported())throw new Error('WebGL을 사용할 수 없습니다. 브라우저의 하드웨어 가속을 켜주세요.');app=new PIXI.Application({width:innerWidth,height:innerHeight,backgroundAlpha:0,antialias:true,autoDensity:true,resolution:Math.min(devicePixelRatio||1,CONFIG.화면.최대해상도배율),autoStart:false});
      world=new PIXI.Container();frameMask=new PIXI.Graphics();fx=new PIXI.Container();fx.eventMode='none';cutLayer=new PIXI.Container();cutLayer.eventMode='none';await createTextures();app.stage.addChild(world,frameMask,fx,cutLayer);$('stage').appendChild(app.view);bindPointer();
      app.ticker.add(()=>{if(!psd||!started)return;const dt=Math.min(app.ticker.deltaMS/1000,.05);time+=dt;updatePlay(dt);updateModel(dt);updateHearts(dt);updateCut();});}
    let documentPSD=null;
    // 레이어 이미지가 있으면 먼저 씁니다. 없거나 실패하면 PSD로 대체합니다.
    if(!buffer&&CONFIG.파일.레이어){try{documentPSD=await loadLayerImages();}catch(error){console.warn('레이어 이미지를 읽지 못해 PSD로 대체합니다.',error);}}
    if(sequence!==loadSequence)return;
    if(!documentPSD){await ensureAgPsd();if(!buffer)buffer=await readPsdBuffer();if(sequence!==loadSequence)return;documentPSD=agPsd.readPsd(buffer,{skipCompositeImageData:true,skipThumbnail:true});}
    buildModel(documentPSD);
    $('loading').hidden=true;$('start').disabled=$('startCourse').disabled=false;$('start').textContent='자유 마사지';if(started){app.start();$('welcome').hidden=true;generateSpots();}else $('welcome').hidden=false;
  }catch(error){if(sequence!==loadSequence)return;console.error(error);$('loading').hidden=true;$('message').hidden=false;$('errorText').textContent=location.protocol==='file:'?'파일을 직접 열었을 때는 PSD 파일을 선택해주세요. 또는 HTTP 서버에서 실행해주세요.':error.message;$('start').textContent='불러오기 필요';}
  finally{if(sequence===loadSequence)loading=false;}
}

let uploadedBackground=null;
function backgroundList(){return uploadedBackground?[...CONFIG.배경.목록,uploadedBackground]:CONFIG.배경.목록;}
function backgroundCss(item){return item.이미지?`url("${String(item.이미지).replace(/"/g,'%22')}")`:item.색||'transparent';}
function setBackground(name,remember=true){
  const item=backgroundList().find(b=>b.이름===name)||CONFIG.배경.목록[0];if(!item)return;
  const css=backgroundCss(item);$('scene').style.background=item.이미지?css+' center/cover no-repeat':css;
  for(const button of $('bgList').children)button.setAttribute('aria-pressed',String(button.dataset.name===item.이름));
  if(remember&&!item.임시)try{localStorage.setItem('masa.background',item.이름);}catch{}
}
function createBackgroundList(){
  $('bgList').replaceChildren();
  for(const item of backgroundList()){const button=document.createElement('button'),swatch=document.createElement('i');button.type='button';button.className='bg-option'+(item.색==='transparent'&&!item.이미지?' none':'');button.dataset.name=item.이름;swatch.style.background=item.이미지?backgroundCss(item)+' center/cover':item.색;if(item.색==='transparent')swatch.style.background='';button.append(swatch,item.이름);button.addEventListener('click',()=>setBackground(item.이름));$('bgList').append(button);}
